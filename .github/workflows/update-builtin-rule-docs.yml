name: Update Builtin Rule Docs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-docs:
    name: Update Builtin Rule Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read current Oxlint version
        id: current-version
        run: |
          version=$(pnpm exec oxlint --version)
          version="${version##*: }"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Get latest Oxlint version
        id: latest-version
        run: |
          version=$(npm view oxlint version)
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Bump Oxlint
        if: steps.current-version.outputs.version != steps.latest-version.outputs.version
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '1440'
        run: pnpm up oxlint@latest

      - name: Verify installed Oxlint version
        id: verified-version
        env:
          OX_VERSION: ${{ steps.latest-version.outputs.version }}
        run: |
          version=$(pnpm exec oxlint --version)
          version="${version##*: }"
          if [ "$version" != "$OX_VERSION" ]; then
            echo "Oxlint ${OX_VERSION} is not installed (actual: ${version}); deferring docs update until a later run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate builtin rule docs
        if: steps.verified-version.outputs.ready == 'true'
        run: pnpm generate:builtin-rule-docs

      - name: Check if generated docs changed
        if: steps.verified-version.outputs.ready == 'true'
        id: docs-changed
        run: pnpm exec tsx scripts/check-builtin-rule-docs.ts >> "$GITHUB_OUTPUT"

      - name: Create changelog
        if: steps.verified-version.outputs.ready == 'true' && steps.docs-changed.outputs.changed == 'true'
        env:
          OX_VERSION: ${{ steps.verified-version.outputs.version }}
        run: |
          hash=$(openssl rand -hex 3)
          cat > ".tegami/$(date +%F)-${hash}.md" <<EOF
          ---
          packages:
            npm:@oxlint-config-inspector/core: patch
            npm:oxlint-config-inspector: patch
          ---

          ### Update builtin rule docs for Oxlint ${OX_VERSION}

          Builtin rule descriptions and documented default options are regenerated against the Oxlint ${OX_VERSION} rule set.
          EOF

      - name: Create or update pull request
        if: steps.verified-version.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTOMATION_PAT }}
          branch: chore/update-builtin-rule-docs
          base: main
          commit-message: 'chore: update builtin rule docs for oxlint ${{ steps.verified-version.outputs.version }}'
          title: 'chore: update builtin rule docs for oxlint ${{ steps.verified-version.outputs.version }}'
          body: |
            Regenerates the builtin rule documentation metadata against Oxlint ${{ steps.verified-version.outputs.version }}.

            - When the Oxlint version changed, the `oxlint` devDependency and lockfile are bumped together with the regenerated metadata.
            - ${{ steps.docs-changed.outputs.changed == 'true' && 'Rule documentation changed. A Tegami patch changelog is included for the core and CLI packages.' || 'Only version metadata or development dependencies changed. No Tegami changelog or package release is needed.' }}
          delete-branch: true

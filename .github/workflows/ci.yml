name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Code Quality and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      TURBO_TOKEN: ${{ matrix.os == 'ubuntu-latest' && secrets.TURBO_TOKEN || '' }}
      TURBO_TEAM: ${{ matrix.os == 'ubuntu-latest' && vars.TURBO_TEAM || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run lint
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Run type check
        if: runner.os == 'Linux'
        run: pnpm typecheck

      - name: Run format check
        if: runner.os == 'Linux'
        run: pnpm format:check

      - name: Run tests
        run: pnpm test
